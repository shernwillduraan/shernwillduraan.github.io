<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trade Journal | Hybrid Traders Academy</title><link rel="stylesheet" href="styles.css?v=20260930"><style>.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.stat{padding:20px;border:1px solid rgba(255,255,255,.1);border-radius:15px;background:rgba(255,255,255,.025)}.stat b{display:block;font-size:1.7rem;margin-top:5px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.section-title{margin:26px 0 10px}.trade{padding:22px 0;border-top:1px solid rgba(255,255,255,.1)}.trade-head{display:flex;justify-content:space-between;gap:15px}.badge{padding:6px 10px;border-radius:999px;font-size:.75rem;border:1px solid rgba(212,175,55,.35);white-space:nowrap}@media(max-width:700px){.stats,.form-grid{grid-template-columns:1fr}.trade-head{display:block}} </style></head><body><header class="nav"><a class="logo" href="index.html"><span class="mark">H</span><span>HYBRID TRADERS <b>ACADEMY</b></span></a><div class="nav-actions"><a class="login" href="student-dashboard.html">DASHBOARD</a><a class="login" href="profile.html">PROFILE</a><a class="login" href="index.html">HOME</a></div></header><main class="form-page"><div style="max-width:1050px;margin:auto"><span class="eyebrow">TRADING PRACTICE</span><h1>TRADE JOURNAL</h1><p style="color:var(--muted);max-width:760px">Record the complete decision process. The journal is designed around Hybrid Traders Academy's Position · Structure · Entry framework.</p><div class="stats" id="stats"></div><div id="app"></div></div></main><script>const key="htaJournal";let trades=JSON.parse(localStorage.getItem(key)||"[]");function esc(s){return String(s??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[m]))}function save(){localStorage.setItem(key,JSON.stringify(trades));render()}function renderStats(){const wins=trades.filter(t=>t.outcome==="Win").length,losses=trades.filter(t=>t.outcome==="Loss").length,be=trades.filter(t=>t.outcome==="Break-even").length,total=trades.length,winRate=total?Math.round(wins/total*100):0;document.getElementById("stats").innerHTML='<div class="stat"><span>TOTAL TRADES</span><b>'+total+'</b></div><div class="stat"><span>WIN RATE</span><b>'+winRate+'%</b></div><div class="stat"><span>WINS</span><b>'+wins+'</b></div><div class="stat"><span>LOSSES</span><b>'+losses+'</b></div>'}function render(){renderStats();document.getElementById("app").innerHTML='<div class="dash-card" style="margin-top:28px"><span>NEW ENTRY</span><h2>Record a Trade</h2><form id="tradeForm"><div class="section-title"><span class="eyebrow">TRADE DETAILS</span></div><div class="form-grid"><input required name="date" type="date" aria-label="Date"><input required name="instrument" placeholder="Instrument e.g. XAUUSD"><select name="direction"><option value="">Direction</option><option>Buy</option><option>Sell</option></select><input name="timeframe" placeholder="Timeframe e.g. 1H / 15M"><input name="entry" placeholder="Entry price"><input name="stop" placeholder="Stop / invalidation"><input name="target" placeholder="Target"><input name="risk" placeholder="Risk %"><input name="rr" placeholder="Planned R:R e.g. 1:2"><select name="setup"><option value="">Setup type</option><option>Continuation</option><option>Reversal</option><option>Breakout</option><option>Retest</option><option>Range</option><option>Other</option></select></div><div class="section-title"><span class="eyebrow">PSE FRAMEWORK</span></div><div class="form-grid"><textarea name="position" placeholder="POSITION — Where is price? What higher-timeframe area is relevant?" rows="5"></textarea><textarea name="structure" placeholder="STRUCTURE — What is price doing? Trend, range, break or shift?" rows="5"></textarea><textarea name="entryPlan" placeholder="ENTRY — What confirms the entry? What invalidates it?" rows="5"></textarea><textarea name="confluence" placeholder="CONFLUENCE — What independent evidence supports the thesis?" rows="5"></textarea></div><div class="section-title"><span class="eyebrow">REVIEW</span></div><div class="form-grid"><select name="outcome" required><option value="">Trade outcome</option><option>Win</option><option>Loss</option><option>Break-even</option><option>Open</option></select><input name="result" placeholder="Result / P&L (optional)"><textarea name="review" placeholder="Post-trade review — What worked? What failed? What will you improve?" rows="5"></textarea><textarea name="lesson" placeholder="Key lesson from this trade" rows="5"></textarea></div><button class="button gold" style="margin-top:18px" type="submit">SAVE TRADE</button></form></div><div class="dash-card" style="margin-top:28px"><span>JOURNAL HISTORY</span><h2>'+trades.length+' TRADE'+(trades.length===1?'':'S')+'</h2><div id="entries">'+(trades.length?trades.map((t,i)=>'<article class="trade"><div class="trade-head"><div><strong>'+esc(t.instrument)+' · '+esc(t.direction)+'</strong><p style="color:var(--muted)">'+esc(t.date)+' · '+esc(t.timeframe)+' · '+esc(t.setup)+'</p></div><span class="badge">'+esc(t.outcome)+'</span></div><p><b>PSE:</b> '+esc(t.position)+' / '+esc(t.structure)+' / '+esc(t.entryPlan)+'</p><p style="color:var(--muted)"><b>Risk:</b> '+esc(t.risk)+' · <b>R:R:</b> '+esc(t.rr)+' · <b>Result:</b> '+esc(t.result)+'</p><p style="color:var(--muted)"><b>Review:</b> '+esc(t.review)+'</p><p style="color:var(--muted)"><b>Lesson:</b> '+esc(t.lesson)+'</p><button class="login" onclick="removeTrade('+i+')">DELETE</button></article>').join(""):'<p style="color:var(--muted)">No trades recorded yet. Your first entry starts your review history.</p>')+'</div></div>';document.getElementById("tradeForm").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const t=Object.fromEntries(f.entries());t.createdAt=new Date().toISOString();trades.unshift(t);save()}}function removeTrade(i){trades.splice(i,1);save()}render();</script></body></html>
