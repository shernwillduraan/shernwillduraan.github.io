<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trade Journal | Hybrid Traders Academy</title><link rel="stylesheet" href="styles.css?v=20260930"></head><body><header class="nav"><a class="logo" href="index.html"><span class="mark">H</span><span>HYBRID TRADERS <b>ACADEMY</b></span></a><div class="nav-actions"><a class="login" href="student-dashboard.html">DASHBOARD</a><a class="login" href="index.html">HOME</a></div></header><main class="form-page"><div style="max-width:1050px;margin:auto"><span class="eyebrow">TRADING PRACTICE</span><h1>TRADE JOURNAL</h1><p style="color:var(--muted);max-width:720px">Document the setup, the decision and the review. Keep the focus on process, risk and execution quality.</p><div id="app"></div></div></main><script>const key="htaJournal";let trades=JSON.parse(localStorage.getItem(key)||"[]");function save(){localStorage.setItem(key,JSON.stringify(trades));render()}function esc(s){return String(s||"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[m]))}function render(){document.getElementById("app").innerHTML='<div class="dash-card" style="margin-top:28px"><span>NEW ENTRY</span><h2>Record a Trade</h2><form id="tradeForm"><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px"><input required name="date" type="date" aria-label="Date"><input required name="instrument" placeholder="Instrument e.g. XAUUSD"><input name="direction" placeholder="Direction: Buy / Sell"><input name="timeframe" placeholder="Timeframe e.g. 1H / 15M"><input name="entry" placeholder="Entry price"><input name="stop" placeholder="Stop / invalidation"><input name="target" placeholder="Target"><input name="risk" placeholder="Risk %"></div><textarea required name="thesis" placeholder="PSE thesis: Position, Structure, Entry" style="width:100%;margin-top:14px;min-height:100px"></textarea><textarea name="result" placeholder="Outcome / result" style="width:100%;margin-top:14px;min-height:80px"></textarea><textarea name="review" placeholder="Post-trade review: What worked? What failed? What will you improve?" style="width:100%;margin-top:14px;min-height:100px"></textarea><button class="button gold" style="margin-top:16px" type="submit">SAVE TRADE</button></form></div><div style="margin-top:28px" id="entries"></div>';document.getElementById("tradeForm").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);trades.unshift(Object.fromEntries(f.entries()));save()};const box=document.getElementById("entries");box.innerHTML='<div class="dash-card"><span>JOURNAL ENTRIES</span><h2>'+trades.length+' Trade'+(trades.length===1?'':'s')+'</h2>'+(trades.length?trades.map((t,i)=>'<article style="padding:20px 0;border-top:1px solid rgba(255,255,255,.1)"><strong>'+esc(t.instrument)+' · '+esc(t.direction)+'</strong><p style="color:var(--muted)">'+esc(t.date)+' · '+esc(t.timeframe)+' · Risk: '+esc(t.risk)+'</p><p>'+esc(t.thesis)+'</p><p style="color:var(--muted)"><b>Outcome:</b> '+esc(t.result)+'</p><p style="color:var(--muted)"><b>Review:</b> '+esc(t.review)+'</p><button class="login" onclick="removeTrade('+i+')">DELETE</button></article>').join(''):'<p style="color:var(--muted)">No trades recorded yet. Your first entry can become the start of your review history.</p>')+'</div>'}function removeTrade(i){trades.splice(i,1);save()}render();</script></body></html>
