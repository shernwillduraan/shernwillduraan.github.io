<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificate | Hybrid Traders Academy</title>
<link rel="stylesheet" href="styles.css?v=20260930">
<style>
body{background:#070707}.cert-page{max-width:1200px;margin:0 auto;padding:35px 20px 70px}.cert-actions{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 25px}.certificate{position:relative;min-height:720px;padding:72px 85px;background:#0a0a0a;border:1px solid rgba(212,175,55,.55);box-shadow:0 0 0 8px #0a0a0a,0 0 0 9px rgba(212,175,55,.22);overflow:hidden;text-align:center}.certificate:before,.certificate:after{content:"";position:absolute;width:210px;height:210px;border:1px solid rgba(212,175,55,.16);border-radius:50%}.certificate:before{left:-100px;top:-100px}.certificate:after{right:-100px;bottom:-100px}.cert-logo{width:86px;height:86px;margin:0 auto 24px;border:1px solid rgba(212,175,55,.7);display:grid;place-items:center;font-size:42px;font-weight:800;color:#d4af37;letter-spacing:-4px;transform:rotate(45deg)}.cert-logo span{transform:rotate(-45deg)}.cert-brand{letter-spacing:.25em;font-size:.78rem;color:#d4af37}.cert-title{font-size:clamp(48px,7vw,82px);line-height:.95;margin:28px 0 10px;letter-spacing:-3px}.cert-sub{color:#aaa;letter-spacing:.12em;text-transform:uppercase}.recipient{font-family:Georgia,serif;font-size:clamp(34px,5vw,58px);margin:34px 0 8px;color:#f5f2e8}.line{width:360px;max-width:80%;height:1px;background:rgba(212,175,55,.55);margin:0 auto 28px}.statement{max-width:720px;margin:0 auto;color:#bdbdbd;line-height:1.8}.completion{margin:30px auto;color:#ddd}.completion strong{color:#d4af37}.signatures{display:flex;justify-content:space-between;gap:60px;max-width:760px;margin:60px auto 0}.sig{flex:1;border-top:1px solid rgba(255,255,255,.25);padding-top:10px;color:#999;font-size:.8rem}.sig b{display:block;color:#eee;font-size:.95rem;margin-bottom:4px}.cert-id{position:absolute;bottom:24px;left:0;right:0;color:#666;font-size:.7rem;letter-spacing:.12em}.locked{max-width:760px;margin:70px auto;text-align:center;padding:35px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(255,255,255,.025)}@media(max-width:700px){.certificate{padding:50px 25px;min-height:650px}.signatures{gap:20px;margin-top:45px}.cert-title{letter-spacing:-2px}.recipient{font-size:34px}}@media print{body{background:#fff}.nav,.cert-actions,.cert-note{display:none!important}.cert-page{padding:0;max-width:none}.certificate{min-height:180mm;height:180mm;padding:42px 55px;background:#0a0a0a;box-shadow:none;page-break-inside:avoid}.cert-title{font-size:58px}.recipient{font-size:44px}@page{size:A4 landscape;margin:10mm}}
</style>
</head>
<body>
<header class="nav"><a class="logo" href="index.html"><span class="mark">H</span><span>HYBRID TRADERS <b>ACADEMY</b></span></a><div class="nav-actions"><a class="login" href="student-dashboard.html">DASHBOARD</a><a class="login" href="profile.html">PROFILE</a></div></header>
<main class="cert-page"><div class="cert-actions"><a class="button" href="student-dashboard.html">← DASHBOARD</a><button class="button gold" onclick="window.print()">PRINT / SAVE CERTIFICATE</button></div><p class="cert-note" style="color:var(--muted);margin-bottom:28px">Your certificate becomes available after completing all 21 lessons and passing all 7 module assessments at 80% or higher.</p><div id="app"></div></main>
<script>
const student=JSON.parse(sessionStorage.getItem("hybridStudent")||"null"),profile=JSON.parse(localStorage.getItem("htaProfile")||"{}"),progress=JSON.parse(localStorage.getItem("htaProgress")||"{}"),assess=JSON.parse(localStorage.getItem("htaAssessments")||"{}");
const API='https://script.google.com/macros/s/AKfycbwxgOfgGp5IsOvTpxvwqT1lLzIHYG6wvIqlCilmJPfAKqDyax5k5tcI0O-yK7ZhXov2rg/exec';
const modules=["market-structure","technical-analysis","price-action","risk-management","trading-psychology","trade-execution","live-market-analysis"];
const name=profile.fullName||student?.fullName||"Academy Student";
function id(){let seed=(student?.email||name)+"|HTA|2026";let h=0;for(let i=0;i<seed.length;i++)h=((h<<5)-h)+seed.charCodeAt(i)|0;return "HTA-"+Math.abs(h).toString(36).toUpperCase().padStart(8,"0")}
function renderCertificate(serverEligible=false,serverId=''){const p=JSON.parse(localStorage.getItem("htaProgress")||"{}"),a=JSON.parse(localStorage.getItem("htaAssessments")||"{}");const lessons=modules.reduce((n,k)=>n+((p[k]||[]).length),0),passed=modules.filter(k=>a[k]?.passed).length;const eligible=serverEligible||(lessons===21&&passed===7);const certId=serverId||id();document.getElementById("app").innerHTML=eligible?'<section class="certificate"><div class="cert-logo"><span>H</span></div><div class="cert-brand">HYBRID TRADERS ACADEMY</div><div class="cert-title">CERTIFICATE<br><em>OF COMPLETION</em></div><div class="cert-sub">Trading Education Program</div><div class="recipient">'+name.replace(/[&<>"]/g,"")+'</div><div class="line"></div><p class="statement">This certificate recognizes the completion of the Hybrid Traders Academy learning program, including all seven core subjects, lesson work and module assessments.</p><p class="completion"><strong>21 / 21 LESSONS COMPLETED</strong> &nbsp; • &nbsp; <strong>7 / 7 ASSESSMENTS PASSED</strong></p><div class="signatures"><div class="sig"><b>SHERNWILL DURAAN</b>CEO & Founder</div><div class="sig"><b>HYBRID TRADERS ACADEMY</b>Academy Certification</div></div><div class="cert-id">CERTIFICATE ID · '+certId+'</div></section>':'<div class="locked"><span class="eyebrow">CERTIFICATE</span><h1>KEEP BUILDING.</h1><p style="color:var(--muted)">Complete all 21 lessons and pass all 7 module assessments at 80% or higher to unlock your branded Certificate of Completion.</p><p style="color:#ddd"><strong>'+lessons+' / 21</strong> lessons completed · <strong>'+passed+' / 7</strong> assessments passed</p><div class="cert-actions" style="justify-content:center"><a class="button gold" href="course.html">CONTINUE LEARNING</a><a class="button" href="assessment.html">VIEW ASSESSMENTS</a></div></div>';
}
renderCertificate(false,'');
(async()=>{if(!student?.email||!student?.accessCode)return;try{const r=await fetch(API,{method:'POST',body:new URLSearchParams({action:'get_completion',email:student.email,accessCode:student.accessCode})});const j=await r.json();if(j.success&&j.completion){localStorage.setItem('htaProgress',JSON.stringify(j.completion.progress||{}));localStorage.setItem('htaAssessments',JSON.stringify(j.completion.assessments||{}));if(j.completion.programComplete){document.querySelector('.cert-note').textContent='Server-verified completion. Certificate ID: '+j.completion.certificateId;renderCertificate(true,j.completion.certificateId);}else renderCertificate(false,'');}}catch(e){}})();
</script>
</body></html>
