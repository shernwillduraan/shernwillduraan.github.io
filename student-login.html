<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login | Hybrid Traders Academy</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="index.html"><span class="brandmark">H</span><span>HYBRID TRADERS <b>ACADEMY</b></span></a><nav><a href="index.html">Home</a><a href="road-to-success.html">ROAD TO SUCCESS</a><a class="btn gold" href="payment.html">Join Academy</a></nav></header><main><section class="section" style="padding-top:150px;min-height:75vh"><div class="container" style="max-width:620px"><p class="kicker">STUDENT ACCESS</p><h1>Welcome <em>back.</em></h1><p class="lead">Log in to access your Hybrid Traders Academy student area.</p><form id="loginForm" class="academy-form"><label>Email Address<input id="email" type="email" autocomplete="email" required></label><label>Access Code<input id="accessCode" type="text" autocomplete="one-time-code" minlength="8" required></label><button class="btn gold" type="submit">Access Student Portal</button><p id="message" role="alert"></p></form><p style="margin-top:25px;opacity:.7">Your access code is provided when your academy account is activated.</p></div></section></main><footer><div class="container footer"><a class="brand" href="index.html"><span class="brandmark">H</span><span>HYBRID TRADERS <b>ACADEMY</b></span></a><p>© 2026 Hybrid Traders Academy. Trading involves risk.</p></div></footer><script>const API='https://script.google.com/macros/s/AKfycbwxgOfgGp5IsOvTpxvwqT1lLzIHYG6wvIqlCilmJPfAKqDyax5k5tcI0O-yK7ZhXov2rg/exec';const form=document.getElementById('loginForm'),msg=document.getElementById('message');form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Checking your access…';try{const body=new URLSearchParams({action:'login',email:document.getElementById('email').value.trim().toLowerCase(),accessCode:document.getElementById('accessCode').value.trim().toUpperCase()});const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const data=await r.json();if(!data.success)throw new Error(data.error||'Login could not be completed.');sessionStorage.setItem('hybridStudent',JSON.stringify(data.student));location.href='student-dashboard.html'}catch(err){msg.textContent=err.message;}});</script></body></html>
