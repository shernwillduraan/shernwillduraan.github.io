<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assessments | Hybrid Traders Academy</title>
<link rel="stylesheet" href="styles.css?v=20260930">
<style>
.assess-wrap{max-width:900px;margin:auto}.question{margin:18px 0;padding:22px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(255,255,255,.025)}.question h3{margin:0 0 15px}.option{display:block;padding:12px;margin:8px 0;border:1px solid rgba(255,255,255,.08);border-radius:10px;color:#ddd;cursor:pointer}.option:hover{border-color:rgba(212,175,55,.45)}.option input{margin-right:9px}.result{display:none;margin-top:24px;padding:24px;border:1px solid rgba(212,175,55,.35);border-radius:16px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.button{cursor:pointer}.error{padding:25px;border:1px solid rgba(255,80,80,.3);border-radius:16px;color:#ddd}
</style>
</head>
<body>
<header class="nav">
<a class="logo" href="index.html"><span class="mark">H</span><span>HYBRID TRADERS <b>ACADEMY</b></span></a>
<div class="nav-actions"><a class="login" href="student-dashboard.html">DASHBOARD</a><a class="login" href="course.html">COURSE HUB</a></div>
</header>
<main class="form-page"><div class="assess-wrap" id="app"></div></main>
<script>
const API='https://script.google.com/macros/s/AKfycbwxgOfgGp5IsOvTpxvwqT1lLzIHYG6wvIqlCilmJPfAKqDyax5k5tcI0O-yK7ZhXov2rg/exec';
const banks={
"market-structure":{title:"Market Structure",qs:[
["What does BOS primarily provide evidence of?","Continuation of the current structural direction",["A guaranteed reversal","A guaranteed profit","A reason to ignore liquidity"]],
["What is CHoCH used to describe?","A meaningful change in price behaviour or structure",["A fixed target","A position size","A news event"]],
["What should you identify before calling a structural break meaningful?","The relevant swing or structural point that was broken",["Every candle","Only an indicator","A random level"]],
["Why is higher-timeframe structure important in SMC?","It provides context for lower-timeframe decisions",["It guarantees entries","It removes risk","It predicts every candle"]],
["What should you avoid when structure is unclear?","Forcing an entry without sufficient confirmation",["Waiting","Reviewing the chart","Defining invalidation"]]]},
"liquidity":{title:"Liquidity",qs:[
["Where is buy-side liquidity commonly studied?","Above obvious highs",["Below obvious lows","Inside every candle","Only at market open"]],
["Where is sell-side liquidity commonly studied?","Below obvious lows",["Above obvious highs","Inside every FVG","Only at market close"]],
["Why can equal highs or lows matter in SMC?","They can identify obvious areas where liquidity may be concentrated",["They guarantee reversal","They guarantee profit","They replace structure"]],
["What is a liquidity sweep?","Price trading through an obvious liquidity area and then reacting",["A guaranteed entry","A risk-free trade","A fixed target"]],
["What should follow a liquidity sweep before an entry is considered?","Additional confirmation such as displacement and structural behaviour",["Automatic entry","Maximum risk","No analysis"]]]},
"order-blocks":{title:"Order Blocks",qs:[
["How are order blocks commonly defined in SMC?","An area associated with the final opposing candle or consolidation before strong displacement",["Every support level","Every large candle","Any random zone"]],
["What makes an order block more meaningful?","Context, displacement and structural relevance",["Its colour alone","Its age alone","A guaranteed target"]],
["What is a bullish order block generally studied as?","A potential area of demand below price in a bullish context",["A resistance area above price","A guaranteed entry","A news level"]],
["What should invalidate an order-block idea?","A predefined structural condition showing the thesis is wrong",["Fear","A random candle","A winning trade"]],
["Should every opposing candle be treated as a valid order block?","No; it must be filtered by context and quality",["Yes","Only on 1-minute charts","Only after news"]]]},
"fair-value-gaps":{title:"Fair Value Gaps",qs:[
["What does an FVG represent in SMC?","An imbalance created by strong displacement across a three-candle sequence",["A guaranteed reversal","A support level only","A trading indicator"]],
["When can an FVG become an area of interest?","When price later retraces into the imbalance in a meaningful context",["Always immediately","Only after profit","Never"]],
["What should be considered alongside an FVG?","Structure, liquidity and location",["Only candle colour","Only account size","Only news"]],
["What creates many useful FVGs?","Strong displacement",["Flat price","Random entries","Low activity only"]],
["Should every FVG be traded?","No; filter for context and confluence",["Yes","Only bearish ones","Only bullish ones"]]]},
"premium-discount":{title:"Premium & Discount",qs:[
["What is a dealing range?","A meaningful high-to-low range used to evaluate price location",["A random box","A position size","A news calendar"]],
["Where is premium generally located?","The upper half of a dealing range",["The lower half","Outside the range","Only at equilibrium"]],
["Where is discount generally located?","The lower half of a dealing range",["The upper half","Outside the range","Only at equilibrium"]],
["What is equilibrium?","The approximate midpoint of the dealing range",["The highest high","The lowest low","The entry price"]],
["Does premium or discount alone guarantee an entry?","No; structure and confirmation are still required",["Yes","Only during London","Only during New York"]]]},
"trade-execution":{title:"SMC Trade Execution",qs:[
["What does PSE stand for?","Position / Structure / Entry",["Price / Stop / Equity","Profit / Size / Exit","Plan / Signal / Emotion"]],
["What does Position tell you?","Where price is within the broader market context",["The guaranteed profit","The broker","The news outcome"]],
["What does Structure tell you?","What price is doing within that location",["Your account balance","Your spread","Your guaranteed target"]],
["What should a valid entry have?","A clear trigger and predefined invalidation",["Only a target","No stop","Unlimited risk"]],
["Where can a logical SMC target come from?","Opposing liquidity, meaningful structure or a left-side inflection",["A random number","Only the entry price","A guaranteed percentage"]]]},
"live-market-analysis":{title:"Live Market Analysis",qs:[
["What should a top-down SMC analysis begin with?","Higher-timeframe structure, liquidity and important areas",["The smallest timeframe","A random entry","Position size"]],
["What is the preferred sequence for deeper analysis?","Weekly → Daily → 4H → 1H when each lower timeframe adds clarity",["1H → 5M → 1M only","Random timeframes","1M only"]],
["Why use primary and alternative scenarios?","To prepare for different valid market developments",["To guarantee a result","To increase risk","To avoid invalidation"]],
["What should invalidate a market thesis?","The predefined price condition that proves the thesis wrong",["Fear","A missed entry","A winning trade"]],
["What is a key SMC discipline?","Wait when the required conditions are not present",["Trade every day","Increase risk when uncertain","Force a setup"]]]}
};
function esc(v){return String(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];});}
const params=new URLSearchParams(location.search);let key=(params.get("module")||"").trim().toLowerCase();const aliases={"technical-analysis":"liquidity","price-action":"order-blocks","risk-management":"fair-value-gaps","trading-psychology":"premium-discount"};key=aliases[key]||key;
const bank=banks[key],app=document.getElementById("app"),student=JSON.parse(sessionStorage.getItem("hybridStudent")||"null");
function renderSelector(){app.innerHTML='<span class="eyebrow">SMC ASSESSMENTS</span><h1>MODULE ASSESSMENTS</h1><p style="color:var(--muted)">Test your understanding of the Hybrid Traders Academy SMC program. Pass mark: 80%.</p><div class="dashboard-grid">'+Object.entries(banks).map(([k,v],i)=>'<a class="dash-card" href="assessment.html?module='+encodeURIComponent(k)+'"><span>'+String(i+1).padStart(2,"0")+' · SMC ASSESSMENT</span><h2>'+esc(v.title)+'</h2><p>5 questions · 80% pass threshold</p></a>').join("")+'</div><a class="button gold" style="display:inline-block;margin-top:30px" href="student-dashboard.html">BACK TO DASHBOARD</a>';}
function renderAssessment(){app.innerHTML='<span class="eyebrow">SMC MODULE ASSESSMENT</span><h1>'+esc(bank.title)+'</h1><p style="color:var(--muted)">Five questions. Pass mark: <strong>80%</strong>. Your result is saved to your Academy account.</p><form id="quiz">'+bank.qs.map((q,i)=>{const opts=[q[1]].concat(q[2]);return '<section class="question"><h3>'+(i+1)+'. '+esc(q[0])+'</h3>'+opts.map((o,j)=>'<label class="option"><input required type="radio" name="q'+i+'" value="'+j+'"> '+esc(o)+'</label>').join("")+'</section>';}).join("")+'<div class="actions"><button class="button gold" type="submit">SUBMIT ASSESSMENT</button><a class="button" href="course.html?module='+encodeURIComponent(key)+'">BACK TO MODULE</a></div></form><div class="result" id="result"></div>';document.getElementById("quiz").addEventListener("submit",submitQuiz);}
async function submitQuiz(e){e.preventDefault();let score=0;bank.qs.forEach((q,i)=>{const chosen=document.querySelector('input[name="q'+i+'"]:checked');if(chosen&&Number(chosen.value)===0)score++;});const total=bank.qs.length,passed=score/total>=.8;const results=JSON.parse(localStorage.getItem("htaAssessments")||"{}");results[key]={score,total,passed,completedAt:new Date().toISOString()};localStorage.setItem("htaAssessments",JSON.stringify(results));const box=document.getElementById("result");box.style.display="block";box.innerHTML='<h2>'+score+'/'+total+' — '+(passed?"Assessment Passed":"Assessment Not Passed")+'</h2><p style="color:var(--muted)">'+(passed?"You reached the 80% pass threshold.":"Review the module and retake the assessment when ready.")+'</p><div class="actions"><a class="button gold" href="assessment.html?module='+encodeURIComponent(key)+'">RETAKE</a><a class="button" href="student-dashboard.html">DASHBOARD</a></div>';if(student?.email&&student?.accessCode){try{const response=await fetch(API,{method:"POST",body:new URLSearchParams({action:"save_assessment",email:student.email,accessCode:student.accessCode,module:key,score:String(score),total:String(total),passed:String(passed),completedAt:new Date().toISOString()})});const data=await response.json();if(!data.success)box.innerHTML+='<p style="color:#aaa">Server save returned: '+esc(data.error||"unknown error")+"</p>";}catch(err){box.innerHTML+='<p style="color:#aaa">Local result saved. Server synchronization can be retried from the dashboard.</p>';}}box.scrollIntoView({behavior:"smooth",block:"center"});}
if(bank)renderAssessment();else renderSelector();
</script>
</body>
</html>
