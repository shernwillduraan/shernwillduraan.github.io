.course-wrap{max-width:1050px;margin:auto}.course-hero{padding:28px 0 10px}.module-meta{color:var(--muted);font-size:.82rem;letter-spacing:.12em;text-transform:uppercase}.lesson{margin-top:18px;padding:24px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(255,255,255,.025)}.lesson h3{margin:5px 0 10px}.lesson p,.lesson li{color:var(--muted);line-height:1.7}.lesson ul{padding-left:20px}.progress-box{margin:22px 0;padding:18px;border:1px solid rgba(212,175,55,.25);border-radius:16px}.bar{height:8px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold,#d4af37);transition:.3s}.check{display:flex;gap:10px;align-items:center;margin-top:18px;color:#ddd}.check input{accent-color:#d4af37}.back{display:inline-block;margin-top:25px}.objectives{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.objective{padding:16px;border-radius:12px;background:rgba(255,255,255,.035);color:var(--muted)}@media(max-width:700px){.objectives{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="nav"><a class="logo" href="index.html"><span class="mark">H</span><span>HYBRID TRADERS <b>ACADEMY</b></span></a><div class="nav-actions"><a class="login" href="student-dashboard.html">DASHBOARD</a><a class="login" href="index.html">HOME</a></div></header>
<main class="form-page"><div class="course-wrap" id="app"></div></main>
<script>
const courses={
"market-structure":{stage:"01 · SMC FOUNDATION",title:"Market Structure",intro:"Learn how Smart Money Concepts begins with understanding the structure of price and the sequence of highs and lows.",obj:["Identify swing highs and swing lows","Understand BOS and CHoCH","Build structural bias before entry"],lessons:[
["Understanding Market Structure","Market structure is the foundation of SMC. Price moves through sequences of highs and lows. A bullish structure generally prints higher highs and higher lows, while bearish structure generally prints lower lows and lower highs. Your first job is to read what price has actually done before predicting what it may do next.","On a clean chart, mark the major swing highs and swing lows. Label the current structure bullish, bearish or ranging and explain why."],
["Break of Structure (BOS)","A Break of Structure occurs when price breaks a meaningful structural point in the direction of the current move. In SMC, BOS is used as evidence of continuation rather than a reason to enter blindly. The importance of a break depends on the timeframe and the structure being broken.","Find three bullish and three bearish BOS examples. For each, identify the structural level that was broken and the direction of the move."],
["CHoCH & Structural Shifts","A Change of Character (CHoCH) is used to describe a meaningful change in the behaviour of price that can warn that the previous structure is losing control. A CHoCH is context, not a guaranteed reversal. Look for it in relation to liquidity, displacement and important areas.","Find two examples where price shifted against the previous structure. Mark the point of the shift and explain what additional evidence would be needed before considering an entry."]]},
"liquidity":{stage:"02 · SMC CORE",title:"Liquidity",intro:"Understand where liquidity forms, why price may seek it, and how liquidity sweeps can become part of an SMC setup.",obj:["Identify buy-side and sell-side liquidity","Recognize equal highs and lows","Understand liquidity sweeps"],lessons:[
["Understanding Liquidity","Liquidity represents areas where orders are likely concentrated. In SMC, obvious highs and lows can attract attention because stops and pending orders may cluster around them. Treat liquidity as a location to study, not as a promise that price must take it.","Mark obvious highs and lows on a chart. Identify which areas may represent buy-side liquidity and which may represent sell-side liquidity."],
["Buy-Side & Sell-Side Liquidity","Buy-side liquidity is commonly associated with stops resting above highs, while sell-side liquidity is commonly associated with stops below lows. Equal highs, equal lows and obvious swing points can make these areas easier to identify.","Find two examples of equal highs and two examples of equal lows. Mark the liquidity pool and describe what happened when price approached it."],
["Liquidity Sweeps & Reversals","A liquidity sweep occurs when price trades through an obvious liquidity area and then reacts. The sweep itself is not an automatic entry. Look for displacement, structural change and a valid entry area after the liquidity event.","Study three liquidity sweeps. For each one, identify the liquidity taken, the reaction after the sweep and the structural confirmation that followed."]]},
"order-blocks":{stage:"03 · SMC CORE",title:"Order Blocks",intro:"Learn how SMC traders use order blocks as areas of interest after meaningful displacement and structural movement.",obj:["Understand bullish and bearish order blocks","Identify displacement around an OB","Filter weak order blocks"],lessons:[
["What Is an Order Block?","An order block is commonly taught in SMC as a price area associated with the final opposing candle or consolidation before a strong displacement move. The exact definition can vary between traders, so the Academy focuses on context rather than treating every candle as an order block.","Find three bullish and three bearish order blocks on historical charts. Record what happened immediately after each area was formed."],
["Bullish & Bearish Order Blocks","A bullish order block is generally studied below price in a bullish scenario, while a bearish order block is generally studied above price in a bearish scenario. Location, structure and the quality of the displacement matter more than the label alone.","Mark one bullish and one bearish order block. Identify the structure that preceded the move and the level that would invalidate the idea."],
["Validating High-Quality Order Blocks","Not every opposing candle is a high-quality order block. Look for meaningful displacement, a structural reason for the move and useful location. An order block becomes more interesting when it aligns with liquidity and higher-timeframe context.","Compare three order blocks: one strong, one weak and one invalid. Write the evidence that separates them."]]},
"fair-value-gaps":{stage:"04 · SMC CORE",title:"Fair Value Gaps",intro:"Study imbalances created by displacement and learn how Fair Value Gaps can become areas of interest.",obj:["Identify three-candle imbalances","Understand bullish and bearish FVGs","Combine FVGs with structure and liquidity"],lessons:[
["Understanding Fair Value Gaps","A Fair Value Gap (FVG) is commonly identified as an imbalance across a three-candle sequence where price moves aggressively and leaves an inefficient area between candles. In SMC, the FVG can become an area of interest for a later retracement.","Find bullish and bearish FVGs on historical charts. Mark the gap boundaries and identify the displacement that created each one."],
["Bullish & Bearish FVGs","Bullish FVGs form during strong upward displacement and bearish FVGs during strong downward displacement. The gap alone is not enough; consider where it formed, what liquidity was involved and what structure was created.","Mark five FVGs and classify each as bullish or bearish. For each, record the surrounding structure and nearby liquidity."],
["FVG Confluence","An FVG becomes more useful when it aligns with a broader SMC narrative such as liquidity, order blocks, structure and premium or discount. The goal is not to trade every gap but to filter for quality.","Choose one FVG setup and build the complete narrative: higher-timeframe location, liquidity event, displacement, FVG, entry idea and invalidation."]]},
"premium-discount":{stage:"05 · SMC FRAMEWORK",title:"Premium & Discount",intro:"Use a dealing range to understand whether price is trading in premium, equilibrium or discount.",obj:["Build a dealing range","Identify premium and discount","Combine location with SMC confirmation"],lessons:[
["The Dealing Range","A dealing range is a defined high-to-low price range used to evaluate where current price sits within that range. The range must be anchored to meaningful structure rather than arbitrary points.","Select a clear dealing range on a higher timeframe. Mark its high, low and equilibrium and explain why those boundaries matter."],
["Premium, Equilibrium & Discount","The upper half of a dealing range is commonly called premium and the lower half discount, with equilibrium around the midpoint. These areas provide context, not automatic entries. A setup still needs structure and confirmation.","Find one bullish scenario in discount and one bearish scenario in premium. Identify the liquidity and structure that support each idea."],
["SMC Location & Confluence","Premium and discount become more powerful when combined with liquidity, order blocks, FVGs and market structure. Location helps answer where to look; structure and confirmation help answer when to act.","Build one complete setup using premium or discount plus at least two other SMC concepts. Define entry, invalidation and target."]]},
"trade-execution":{stage:"06 · EXECUTION",title:"SMC Trade Execution",intro:"Turn an SMC narrative into a disciplined trade plan using Position, Structure and Entry.",obj:["Build an SMC trade thesis","Define confirmation and invalidation","Plan entries, stops and targets"],lessons:[
["The PSE Framework","PSE means Position, Structure and Entry. Position asks where price is within the broader context. Structure asks what price is doing. Entry defines the specific confirmation and execution point. The three must tell the same story.","Write one complete PSE thesis using liquidity, structure and an entry area. Do not place a trade until the invalidation is clear."],
["SMC Entry Model","A disciplined SMC entry can combine higher-timeframe location, a liquidity event, displacement, structural confirmation and a return to an order block or FVG. Not every setup will contain every concept; the goal is a clear, repeatable model.","Create a bullish and bearish SMC entry model. For each, define the location, liquidity event, confirmation, entry, stop and invalidation."],
["Targets & Trade Management","Targets should come from meaningful opposing liquidity, structure or left-side inflections. Management rules should be decided before the trade becomes emotional. Risk remains defined even when the setup looks strong.","Build a complete trade plan from entry to target. Include the reason for the target, the invalidation level and the rule you will follow if price moves in your favour."]]},
"live-market-analysis":{stage:"07 · LIVE APPLICATION",title:"Live Market Analysis",intro:"Apply the complete SMC framework through a top-down process without forcing a trade when conditions are unclear.",obj:["Build a top-down SMC bias","Create primary and alternative scenarios","Review analysis against actual price"],lessons:[
["Top-Down SMC Analysis","Start from the higher timeframe and identify major structure, liquidity and important areas. Move down through Daily, 4H and 1H only when the lower timeframe provides clearer information. Do not abandon a clear higher-timeframe thesis simply because a lower timeframe is noisy.","Complete a Weekly → Daily → 4H → 1H analysis. Mark structure, liquidity, premium/discount and the areas where an SMC setup could develop."],
["Scenario Planning & Confirmation","A market can develop in different ways. Build a primary scenario and an alternative scenario. Define what price must do to activate each scenario and what would invalidate it. This prevents forcing a narrative onto the chart.","Write two scenarios for the same instrument. Include the liquidity objective, expected structural behaviour, entry area and invalidation for each."],
["Complete SMC Market Model","Bring everything together: higher-timeframe structure, liquidity, premium/discount, order block or FVG, displacement, confirmation, PSE execution and target. If the conditions are not present, the correct action can be to wait.","Perform a complete analysis on a historical or live chart. Save your chart, thesis, entry model, invalidation and target, then review the outcome without changing the original analysis."]] }
};

function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
const key=new URLSearchParams(location.search).get("module"),c=courses[key];
const app=document.getElementById("app");
if(!c){app.innerHTML='<span class="eyebrow">ACADEMY SMC PROGRAM</span><h1>COURSE HUB</h1><p style="color:var(--muted);max-width:780px">Master the Hybrid Traders Academy SMC curriculum from structure and liquidity through execution and live market analysis.</p><div class="dashboard-grid">'+Object.entries(courses).map(([k,v],i)=>'<a class="dash-card" href="course.html?module='+k+'"><span>'+String(i+1).padStart(2,"0")+' · '+v.stage.split(" · ")[1]+'</span><h2>'+v.title+'</h2><p>'+v.intro+'</p></a>').join("")+'</div><a class="button gold" style="display:inline-block;margin-top:30px" href="student-dashboard.html">BACK TO DASHBOARD</a>';}
else{
const saved=JSON.parse(localStorage.getItem("htaProgress")||"{}"),done=saved[key]||[];
const student=JSON.parse(sessionStorage.getItem("hybridStudent")||"null");
const API=window.HYBRID_API||'https://script.google.com/macros/s/AKfycbwxgOfgGp5IsOvTpxvwqT1lLzIHYG6wvIqlCilmJPfAKqDyax5k5tcI0O-yK7ZhXov2rg/exec';
async function serverProgress(action,extra={}){if(!student?.email||!student?.accessCode)return null;try{const r=await fetch(API,{method:"POST",body:new URLSearchParams({action,email:student.email,accessCode:student.accessCode,...extra})});return await r.json();}catch(e){return null;}}
app.innerHTML='<div class="course-hero"><span class="eyebrow">'+c.stage+'</span><h1>'+c.title+'</h1><p style="color:var(--muted);max-width:780px">'+c.intro+'</p></div><div class="objectives">'+c.obj.map(x=>'<div class="objective">'+esc(x)+'</div>').join("")+'</div><div class="progress-box"><strong>MODULE PROGRESS</strong><p id="progressText" style="color:var(--muted)">0 of '+c.lessons.length+' lessons complete</p><div class="bar"><i id="bar"></i></div></div>'+c.lessons.map((l,i)=>'<article class="lesson"><span class="module-meta">Lesson '+(i+1)+'</span><h3>'+esc(l[0])+'</h3><p>'+esc(l[1])+'</p><h4>Practical Exercise</h4><p>'+esc(l[2])+'</p><label class="check"><input type="checkbox" data-i="'+i+'" '+(done.includes(i)?"checked":"")+'> Mark lesson complete</label></article>').join("")+'<a class="button gold back" href="assessment.html?module='+encodeURIComponent(key)+'">TAKE ASSESSMENT</a> <a class="button back" href="course.html">ALL SUBJECTS</a> <a class="button back" href="student-dashboard.html">DASHBOARD</a>';
function update(){const boxes=[...document.querySelectorAll("[data-i]")],d=boxes.filter(x=>x.checked).map(x=>+x.dataset.i);saved[key]=d;localStorage.setItem("htaProgress",JSON.stringify(saved));document.getElementById("progressText").textContent=d.length+" of "+c.lessons.length+" lessons complete";document.getElementById("bar").style.width=(d.length/c.lessons.length*100)+"%";serverProgress("save_progress",{module:key,lessons:JSON.stringify(d)});}
document.querySelectorAll("[data-i]").forEach(x=>x.addEventListener("change",update));
(async()=>{const r=await serverProgress("get_progress",{module:key});if(r?.success&&r.progress?.[key]){saved[key]=r.progress[key];localStorage.setItem("htaProgress",JSON.stringify(saved));document.querySelectorAll("[data-i]").forEach(x=>x.checked=saved[key].includes(+x.dataset.i));}update();})();
}
</script>
</body></html>
