<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course | Hybrid Traders Academy</title>
<link rel="stylesheet" href="styles.css?v=20260930">
<style>
.course-wrap{max-width:1050px;margin:auto}.course-hero{padding:28px 0 10px}.module-meta{color:var(--muted);font-size:.82rem;letter-spacing:.12em;text-transform:uppercase}.lesson{margin-top:18px;padding:24px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(255,255,255,.025)}.lesson h3{margin:5px 0 10px}.lesson p,.lesson li{color:var(--muted);line-height:1.7}.lesson ul{padding-left:20px}.progress-box{margin:22px 0;padding:18px;border:1px solid rgba(212,175,55,.25);border-radius:16px}.bar{height:8px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold,#d4af37);transition:.3s}.check{display:flex;gap:10px;align-items:center;margin-top:18px;color:#ddd}.check input{accent-color:#d4af37}.back{display:inline-block;margin-top:25px}.objectives{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.objective{padding:16px;border-radius:12px;background:rgba(255,255,255,.035);color:var(--muted)}@media(max-width:700px){.objectives{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="nav"><a class="logo" href="index.html"><span class="mark">H</span><span>HYBRID TRADERS <b>ACADEMY</b></span></a><div class="nav-actions"><a class="login" href="student-dashboard.html">DASHBOARD</a><a class="login" href="index.html">HOME</a></div></header>
<main class="form-page"><div class="course-wrap" id="app"></div></main>
<script>
const courses={
"market-structure":{stage:"01 · FOUNDATION",title:"Market Structure",intro:"Learn how price moves through trends, ranges, breaks and shifts before looking for an entry.",obj:["Identify trend and range conditions","Mark meaningful structural points","Separate confirmation from assumption"],lessons:[
["Structure Basics","Understand swing highs, swing lows, higher highs, higher lows, lower highs and lower lows. Start with what price has actually done, not what you expect it to do.","Map the most recent major highs and lows on a clean chart. Label the current condition as bullish, bearish or ranging."],
["Breaks & Shifts","A structural break can show continuation, while a change in the sequence of highs and lows can warn that conditions are changing. Always define the level that would invalidate your idea.","Find three historical examples of continuation and three examples of a structural shift. Write what changed in each case."],
["Position & Areas of Value","Structure becomes more useful when combined with location. Study where price is trading relative to important weekly and daily areas before planning an entry.","Choose one instrument and mark its weekly area of value, daily structure and the price level that would invalidate your thesis."]]},
"technical-analysis":{stage:"02 · ANALYSIS",title:"Technical Analysis",intro:"Build a repeatable process for reading levels, zones, confluence and multiple timeframes.",obj:["Mark relevant support and resistance","Use multiple timeframes logically","Build confluence without overloading a chart"],lessons:[
["Levels & Zones","Support and resistance are areas where price has previously reacted. Focus on significant reactions and avoid filling the chart with every minor level.","Mark two major zones on a higher timeframe and explain why each matters."],
["Multi-Timeframe Analysis","Begin with the higher-timeframe context, then move down only when the picture becomes clearer. A lower timeframe should refine the thesis, not replace it.","Perform a Weekly → Daily → 4H → 1H review and record what each timeframe adds."],
["Confluence","Confluence means several independent pieces of evidence support the same scenario. More indicators do not automatically mean better analysis.","Create one setup using location, structure and price action. Remove any indicator that does not improve the decision."]]},
"price-action":{stage:"03 · ANALYSIS",title:"Price Action",intro:"Read the story of price through reactions, formations and continuation structures.",obj:["Read candle behaviour in context","Recognize rejection and continuation","Avoid isolated candle signals"],lessons:[
["Reading Reactions","Candles are information about the battle between buyers and sellers. A candle matters most when it appears at a meaningful location.","Find three strong reactions at important zones and describe what price did before and after each reaction."],
["Formations","Use formations as evidence rather than automatic signals. Context, location and structure determine whether a pattern has meaning.","Study a reversal formation and a continuation formation. Identify the level that confirms each scenario."],
["Continuation Structures","After an impulse, price may consolidate before continuing. Learn to distinguish orderly continuation from a structure that has lost its original thesis.","Find one continuation structure and write your entry condition, invalidation level and target logic."]]},
"risk-management":{stage:"04 · EXECUTION",title:"Risk Management",intro:"Protect capital by defining risk before execution and keeping exposure consistent.",obj:["Define invalidation before entry","Control position size","Understand reward and risk"],lessons:[
["Risk Per Trade","Risk should be defined before the trade is opened. Your stop level represents where the thesis is invalid, not a random distance from entry.","Write a personal maximum risk rule and apply it consistently to five example trades."],
["Position Sizing","Position size connects your account risk to the distance between entry and invalidation. A wider stop generally requires a smaller position for the same account risk.","Calculate position size for three hypothetical trades using the same account-risk percentage but different stop distances."],
["Trade Protection","Risk management also includes exposure, correlation, daily limits and knowing when not to trade. Protect the process, not just one position.","Create a pre-trade checklist covering risk, invalidation, exposure, target and reasons to stay out."]]},
"trading-psychology":{stage:"05 · DEVELOPMENT",title:"Trading Psychology",intro:"Develop discipline by building a process that reduces emotional decision making.",obj:["Follow a defined process","Manage fear and greed","Review behaviour objectively"],lessons:[
["Process Over Emotion","A good process gives you rules to follow when the market is moving quickly. The goal is consistent decision making, not certainty.","Write your five non-negotiable trading rules and keep them visible before every session."],
["Patience & Discipline","Not trading is also a decision. Waiting for your conditions protects you from forcing setups that are not present.","Review five recent trades or examples and identify where patience improved or could have improved the decision."],
["Review & Accountability","A trading journal turns experience into feedback. Record the reason for the trade, execution quality and whether you followed your plan.","Create a weekly review with three sections: what worked, what failed, and what changes next week."]]},
"trade-execution":{stage:"06 · EXECUTION",title:"Trade Execution",intro:"Turn analysis into a clear plan covering position, structure, entry, risk and target.",obj:["Build a complete trade thesis","Define entry and invalidation","Execute without improvising"],lessons:[
["The PSE Framework","PSE means Position, Structure and Entry. Position tells you where price is, structure tells you what price is doing, and entry defines the trigger.","Write one complete PSE thesis on a chart before considering an entry."],
["Entry & Invalidation","A valid entry has a reason, a trigger and a clear point where the thesis is wrong. Define these before placing an order.","Create two entry scenarios: one continuation and one reversal. Give each a trigger and invalidation."],
["Targets & Management","Targets should be based on market structure and meaningful opposing areas. Trade management should be planned before emotion takes over.","Mark a logical target using a left-side inflection or opposing structure. Document your management rules."]]},
"live-market-analysis":{stage:"07 · DEVELOPMENT",title:"Live Market Analysis",intro:"Apply the Academy framework to live conditions without forcing a trade.",obj:["Build a top-down market thesis","Document scenarios and invalidation","Review analysis after the market develops"],lessons:[
["Top-Down Routine","Start with higher-timeframe areas and move toward execution only when the market provides clarity. Keep the analysis structured and repeatable.","Complete a Weekly → Daily → 4H → 1H analysis on one instrument and save your thesis."],
["Scenario Planning","Markets can develop in more than one way. Build a primary scenario and an alternative scenario, each with a clear invalidation point.","Write two scenarios for the same market and identify what price action would activate or invalidate each."],
["Post-Market Review","Analysis improves when you compare your original thesis with what actually happened. Do not rewrite history after the move.","Review a completed market session. Record your original thesis, actual outcome, execution quality and one lesson."]]}
};
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
const key=new URLSearchParams(location.search).get("module"),c=courses[key];
const app=document.getElementById("app");
if(!c){app.innerHTML='<span class="eyebrow">ACADEMY LEARNING AREA</span><h1>COURSE HUB</h1><p style="color:var(--muted)">Choose a subject and work through its learning path.</p><div class="dashboard-grid">'+Object.entries(courses).map(([k,v],i)=>'<a class="dash-card" href="course.html?module='+k+'"><span>'+String(i+1).padStart(2,"0")+' · '+v.stage.split(" · ")[1]+'</span><h2>'+v.title+'</h2><p>'+v.intro+'</p></a>').join("")+'</div><a class="button gold" style="display:inline-block;margin-top:30px" href="student-dashboard.html">BACK TO DASHBOARD</a>';}
else{
const saved=JSON.parse(localStorage.getItem("htaProgress")||"{}"),done=saved[key]||[];
const student=JSON.parse(sessionStorage.getItem("hybridStudent")||"null");
const API=window.HYBRID_API||'https://script.google.com/macros/s/AKfycbwxgOfgGp5IsOvTpxvwqT1lLzIHYG6wvIqlCilmJPfAKqDyax5k5tcI0O-yK7ZhXov2rg/exec';
async function serverProgress(action,extra={}){if(!student?.email||!student?.accessCode)return null;try{const r=await fetch(API,{method:'POST',body:new URLSearchParams({action,email:student.email,accessCode:student.accessCode,...extra})});return await r.json();}catch(e){return null;}}
app.innerHTML='<div class="course-hero"><span class="eyebrow">'+c.stage+'</span><h1>'+c.title+'</h1><p style="color:var(--muted);max-width:780px">'+c.intro+'</p></div><div class="objectives">'+c.obj.map(x=>'<div class="objective">'+esc(x)+'</div>').join("")+'</div><div class="progress-box"><strong>MODULE PROGRESS</strong><p id="progressText" style="color:var(--muted)">0 of '+c.lessons.length+' lessons complete</p><div class="bar"><i id="bar"></i></div></div>'+c.lessons.map((l,i)=>'<article class="lesson"><span class="module-meta">Lesson '+(i+1)+'</span><h3>'+esc(l[0])+'</h3><p>'+esc(l[1])+'</p><h4>Practical Exercise</h4><p>'+esc(l[2])+'</p><label class="check"><input type="checkbox" data-i="'+i+'" '+(done.includes(i)?"checked":"")+'> Mark lesson complete</label></article>').join("")+'<a class="button gold back" href="assessment.html?module='+key+'">TAKE ASSESSMENT</a> <a class="button back" href="course.html">ALL SUBJECTS</a> <a class="button back" href="student-dashboard.html">DASHBOARD</a>';
function update(){const boxes=[...document.querySelectorAll("[data-i]")],d=boxes.filter(x=>x.checked).map(x=>+x.dataset.i);saved[key]=d;localStorage.setItem("htaProgress",JSON.stringify(saved));document.getElementById("progressText").textContent=d.length+" of "+c.lessons.length+" lessons complete";document.getElementById("bar").style.width=(d.length/c.lessons.length*100)+"%";serverProgress('save_progress',{module:key,lessons:JSON.stringify(d)});}
document.querySelectorAll("[data-i]").forEach(x=>x.addEventListener("change",update));
(async()=>{const r=await serverProgress('get_progress',{module:key});if(r?.success&&r.progress?.[key]){saved[key]=r.progress[key];localStorage.setItem('htaProgress',JSON.stringify(saved));document.querySelectorAll("[data-i]").forEach(x=>x.checked=saved[key].includes(+x.dataset.i));}update();})();
}
</script>
</body></html>
