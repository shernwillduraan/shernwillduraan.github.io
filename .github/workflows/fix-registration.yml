name: Fix academy registration form

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-registration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update registration JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          new_reg = r'''document.getElementById('reg').onsubmit=async e=>{e.preventDefault();let form=e.target,n=document.getElementById('regn'),data=new URLSearchParams();data.append('action','register');data.append('fullName',form.querySelector('[name="name"]').value.trim());data.append('email',form.querySelector('[name="email"]').value.trim());data.append('whatsapp',form.querySelector('[name="phone"]').value.trim());data.append('package','Complete Academy');data.append('experience',form.querySelector('[name="experience"]').value);data.append('goal',form.querySelector('[name="goal"]').value.trim());n.className='notice show';n.textContent='Submitting registration…';try{await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:data.toString(),keepalive:true});n.textContent='Registration sent. Please allow a moment for it to appear in the academy system.';form.reset()}catch(x){n.textContent='Registration could not be sent. Please try again.'}};'''

          pattern = r"document\.getElementById\('reg'\)\.onsubmit=.*?;document\.getElementById\('login'\)\.onsubmit="
          replacement = new_reg + "document.getElementById('login').onsubmit="
          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Registration handler not found; no change made.')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit registration fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix academy registration submission format"
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/fix-registration.yml
          git commit -m "Remove one-time registration fix workflow"
          git push