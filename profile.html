<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Profile | Hybrid Traders Academy</title><link rel="stylesheet" href="styles.css?v=20260930"><style>.profile{max-width:850px;margin:auto}.profile-card{margin-top:28px;padding:28px;border:1px solid rgba(212,175,55,.25);border-radius:18px;background:rgba(255,255,255,.025)}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin:14px 0}.field label{display:block;margin-bottom:7px;color:#ddd;font-size:.85rem}.field input,.field select,.field textarea{width:100%;box-sizing:border-box}.status{display:inline-block;padding:8px 12px;border:1px solid rgba(212,175,55,.35);border-radius:999px;color:#d4af37;font-size:.8rem;letter-spacing:.08em}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><header class="nav"><a class="logo" href="index.html"><span class="mark">H</span><span>HYBRID TRADERS <b>ACADEMY</b></span></a><div class="nav-actions"><a class="login" href="student-dashboard.html">DASHBOARD</a><button class="login" id="logout">LOG OUT</button></div></header><main class="form-page"><div class="profile"><span class="eyebrow">STUDENT ACCOUNT</span><h1>MY PROFILE</h1><p style="color:var(--muted)">Keep your Academy information up to date.</p><div class="profile-card"><span class="status">ACADEMY STUDENT</span><form id="profileForm"><div class="row"><div class="field"><label>Full Name</label><input id="name" name="name" required></div><div class="field"><label>Email</label><input id="email" name="email" type="email" readonly></div></div><div class="row"><div class="field"><label>WhatsApp</label><input id="whatsapp" name="whatsapp"></div><div class="field"><label>Trading Experience</label><select id="experience" name="experience"><option value="">Select</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>Professional</option></select></div></div><div class="field"><label>Trading Goal</label><textarea id="goal" name="goal" rows="4" placeholder="What are you working toward as a trader?"></textarea></div><button class="button gold" type="submit">SAVE PROFILE</button><span id="saved" style="margin-left:12px;color:var(--muted)"></span></form></div><div class="profile-card"><span class="eyebrow">ACCOUNT</span><h2>Learning Status</h2><p style="color:var(--muted)">Your profile currently lives in your active student session and browser storage. Server synchronization can be added later.</p><a class="button" href="student-dashboard.html">BACK TO DASHBOARD</a></div></div></main><script>const raw=sessionStorage.getItem('hybridStudent');if(!raw)location.href='student.html';let student={};try{student=JSON.parse(raw)||{}}catch(e){}const saved=JSON.parse(localStorage.getItem('htaProfile')||'{}');const data={...student,...saved};document.getElementById('name').value=data.fullName||data.name||'';document.getElementById('email').value=data.email||'';document.getElementById('whatsapp').value=data.whatsapp||'';document.getElementById('experience').value=data.experience||'';document.getElementById('goal').value=data.goal||'';document.getElementById('profileForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const p={fullName:f.get('name'),email:data.email||'',whatsapp:f.get('whatsapp'),experience:f.get('experience'),goal:f.get('goal')};localStorage.setItem('htaProfile',JSON.stringify(p));sessionStorage.setItem('hybridStudent',JSON.stringify({...student,...p}));document.getElementById('saved').textContent='Profile saved';setTimeout(()=>document.getElementById('saved').textContent='',2200)};document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('hybridStudent');location.href='student.html'};</script></body></html>
